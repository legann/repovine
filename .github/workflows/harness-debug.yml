# TEMPORARY debug workflow: runs ONLY the harness demo suite + container smokes
# on push while the harness-linux failure is being diagnosed. Prints tool
# versions first and extracts failing TAP sections into a compact block so the
# failure survives UI log truncation. Delete this file and restore the triggers
# in ci.yml / embedder-matrix.yml once harness-linux is green again.
name: harness-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  harness-debug:
    name: harness-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tool versions
        run: |
          node --version
          docker version
          docker compose version

      - name: Install engine dependencies
        run: npm ci

      - name: Build engine
        run: npm run build

      - name: Install demo dependencies
        run: npm ci
        working-directory: examples/agent-harness-demo

      - name: Demo tests (full TAP kept, failures extracted)
        working-directory: examples/agent-harness-demo
        run: |
          set -o pipefail
          rc=0
          node --test test/*.mjs > tap.log 2>&1 || rc=$?
          echo "==== SUMMARY ===="
          grep -E "^# (tests|pass|fail|skipped)" tap.log || true
          echo "==== FAILING SECTIONS ===="
          awk '/^not ok /{p=40} p{print; p--}' tap.log
          exit $rc

      - name: Enable IPv6 in the Docker daemon
        run: |
          sudo mkdir -p /etc/docker
          echo '{"ipv6": true, "ip6tables": true, "experimental": true, "fixed-cidr-v6": "fd00:dead:beef::/48"}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker network create --ipv6 --subnet fd42:7265:706f:7699::/64 rv-ipv6-probe
          docker network rm rv-ipv6-probe

      - name: Docker container smokes (egress + local-model forward)
        run: npm run test:docker-smoke
        working-directory: examples/agent-harness-demo
        env:
          HARNESS_SMOKE_STRICT: '1'

      - name: Compose down
        if: always()
        run: docker compose --profile cli down -v --remove-orphans || true
        working-directory: examples/agent-harness-demo
