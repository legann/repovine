name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual npm publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Read package versions
        run: |
          root_version="$(node -p 'require("./package.json").version')"
          sdk_version="$(node -p 'require("./packages/plugin-sdk/package.json").version')"
          printf 'ROOT_VERSION=%s\n' "$root_version" >> "$GITHUB_ENV"
          printf 'SDK_VERSION=%s\n' "$sdk_version" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          if [ "v${ROOT_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${ROOT_VERSION}"
            exit 1
          fi

      # A publish never outruns the platform contract: every Tier-1 merge gate
      # must have completed green on the exact commit being published. Missing
      # or failed check-runs fail the publish — absence of evidence is failure.
      - name: Verify Tier-1 gates are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          required="core-linux core-windows core-macos-arm harness-linux"
          sha="$(git rev-parse HEAD)"
          runs="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
          fail=0
          for name in $required; do
            conclusion="$(printf '%s' "$runs" | node -e '
              const chunks = [];
              process.stdin.on("data", (c) => chunks.push(c));
              process.stdin.on("end", () => {
                const { check_runs = [] } = JSON.parse(Buffer.concat(chunks).toString());
                const run = check_runs.find((r) => r.name === process.argv[1]);
                console.log(run ? `${run.status}/${run.conclusion}` : "absent");
              });
            ' "$name")"
            if [ "$conclusion" != "completed/success" ]; then
              echo "::error::Tier-1 gate '$name' is not green on ${sha}: $conclusion"
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify bin entry
        run: |
          set -o pipefail
          test -f dist/mcp/index.js
          head -1 dist/mcp/index.js | grep -qx '#!/usr/bin/env node'

      - name: Publish plugin SDK (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish -w @repovine/plugin-sdk --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish root package (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish plugin SDK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: |
          if npm view "@repovine/plugin-sdk@${SDK_VERSION}" version >/dev/null 2>&1; then
            echo "@repovine/plugin-sdk@${SDK_VERSION} is already published; skipping"
          else
            npm publish -w @repovine/plugin-sdk --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish root package
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: |
          set -o pipefail
          test "$(npm view "@repovine/plugin-sdk@${SDK_VERSION}" version)" = "${SDK_VERSION}"
          test "$(npm view "repovine@${ROOT_VERSION}" version)" = "${ROOT_VERSION}"

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          NPM_CONFIG_CACHE="$smoke_dir/.npm-cache" npx -y "repovine@${ROOT_VERSION}" --help | grep -q 'repovine'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
