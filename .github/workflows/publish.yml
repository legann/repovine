name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual npm publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # mint the OIDC token npm exchanges for a publish credential
    steps:
      - uses: actions/checkout@v5

      # registry-url is intentionally omitted. When set, setup-node writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the .npmrc it
      # manages; with no token that placeholder expands empty, npm treats auth as
      # already configured, and the OIDC token exchange never runs (ENEEDAUTH/E404).
      # npm defaults to registry.npmjs.org, so OIDC publishing works without it.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Node 22 bundles npm 10.x. Staged publishing needs npm >= 11.15.0 (which
      # also clears the >= 11.5.1 OIDC floor); Node 22.x satisfies the >= 22.14.0
      # runtime floor. Stay on 11.x via the caret range.
      - name: Upgrade npm for staged publishing
        run: |
          npm install -g 'npm@^11.15.0'
          npm --version

      - name: Read package versions
        run: |
          root_version="$(node -p 'require("./package.json").version')"
          sdk_version="$(node -p 'require("./packages/plugin-sdk/package.json").version')"
          printf 'ROOT_VERSION=%s\n' "$root_version" >> "$GITHUB_ENV"
          printf 'SDK_VERSION=%s\n' "$sdk_version" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          if [ "v${ROOT_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${ROOT_VERSION}"
            exit 1
          fi

      # The tag check above only guards `push`. A non-dry-run workflow_dispatch reaches the staging
      # steps from any ref, so require the commit to be on main — otherwise a branch commit that was
      # never tagged or merged can be staged for approval.
      - name: Verify dispatch publishes a commit on main
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main; publish a tagged commit merged to main"
            exit 1
          fi

      # A publish never outruns the platform contract: every Tier-1 merge gate
      # must have completed green on the exact commit being published. Missing
      # or failed check-runs fail the publish — absence of evidence is failure.
      - name: Verify Tier-1 gates are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          required="core-linux core-windows core-macos-arm harness-linux"
          sha="$(git rev-parse HEAD)"
          runs="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
          fail=0
          for name in $required; do
            conclusion="$(printf '%s' "$runs" | node -e '
              const chunks = [];
              process.stdin.on("data", (c) => chunks.push(c));
              process.stdin.on("end", () => {
                const { check_runs = [] } = JSON.parse(Buffer.concat(chunks).toString());
                const run = check_runs.find((r) => r.name === process.argv[1]);
                console.log(run ? `${run.status}/${run.conclusion}` : "absent");
              });
            ' "$name")"
            if [ "$conclusion" != "completed/success" ]; then
              echo "::error::Tier-1 gate '$name' is not green on ${sha}: $conclusion"
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify bin entry
        run: |
          set -o pipefail
          test -f dist/mcp/index.js
          head -1 dist/mcp/index.js | grep -qx '#!/usr/bin/env node'

      # --dry-run packs and validates the tarball locally without contacting the
      # registry, so it needs no auth and no OIDC. It exercises packaging only.
      - name: Validate plugin SDK packaging (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish -w @repovine/plugin-sdk --dry-run

      - name: Validate root package packaging (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run

      # Staged publishing: `npm stage publish` uploads the tarball to a stage
      # queue and authenticates over OIDC (no token). It has full parity with
      # `npm publish`, so --provenance and --access public are valid and preserved.
      # The version is NOT live until a maintainer approves it with 2FA.
      #
      # Idempotency: skip only when the exact version is already live. `npm view`
      # of a pinned version is a public, exact-match read — no auth, no substring
      # ambiguity (0.1.1 never matches 0.1.10). A version that is merely STAGED
      # (pending approval) is deliberately not re-guarded: re-staging it fails
      # loudly on the unique-version index, which correctly signals "approve or
      # reject the pending stage", not "silently re-stage". `npm stage list` is not
      # used — under a stage-only trusted publisher it may be unauthorized in CI,
      # and its text output format is unspecified.
      - name: Stage plugin SDK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: |
          if npm view "@repovine/plugin-sdk@${SDK_VERSION}" version >/dev/null 2>&1; then
            echo "@repovine/plugin-sdk@${SDK_VERSION} is already published (live); skipping stage"
          else
            npm stage publish -w @repovine/plugin-sdk --provenance --access public
          fi

      - name: Stage root package
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: |
          if npm view "repovine@${ROOT_VERSION}" version >/dev/null 2>&1; then
            echo "repovine@${ROOT_VERSION} is already published (live); skipping stage"
          else
            npm stage publish --provenance --access public
          fi

      # Staged versions are not on the read path (npm view / npm install 404) until
      # approved, so live-package verification cannot run in CI. Print what was
      # staged and the exact manual approval steps instead.
      - name: Report staged versions for maintainer approval
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: |
          cat <<EOF
          ============================================================
          Packages are STAGED, not live. A maintainer must approve them.
          ============================================================
          Staged in this run:
            @repovine/plugin-sdk@${SDK_VERSION}
            repovine@${ROOT_VERSION}

          Staged versions are not installable and do not appear in
          'npm view' until a maintainer approves them.

          APPROVE THE SDK FIRST, THEN THE ROOT — the order is required, not a
          preference. repovine@${ROOT_VERSION} pins
          @repovine/plugin-sdk@${SDK_VERSION} exactly, so approving the root
          first puts a release on the registry whose 'npm install' and 'npx'
          fail with ETARGET until the SDK follows.

          Approve from a machine with interactive 2FA (an OIDC/CI token
          cannot approve a stage):

            # 1. SDK first
            npm stage list @repovine/plugin-sdk   # show the pending <stage-id>
            npm stage view <stage-id>             # inspect tarball + metadata
            npm stage approve <stage-id>          # publishes live, prompts 2FA

            # 2. Confirm the SDK is actually live BEFORE approving the root
            npm view "@repovine/plugin-sdk@${SDK_VERSION}" version

            # 3. Root only after that command prints the version
            npm stage list repovine
            npm stage view <stage-id>
            npm stage approve <stage-id>

          If the root was approved first, the fix is to approve the SDK
          immediately; installs recover with no version bump.

          Discard a stage instead: npm stage reject <stage-id>
          After approval, confirm live: npm view "repovine@${ROOT_VERSION}" version
          ============================================================
          EOF
