# TEMPORARY debug workflow: isolates the silent native crash (0xC0000409) of
# the client-projections suite on windows-latest. Runs the suite DIRECTLY
# (node:test in-process, no runner child): progress prints as tests complete,
# so the last printed name localizes the crash. Delete this file and restore
# the ci.yml/embedder-matrix.yml triggers when green.
name: Projections debug (windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  projections-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bisect probe (phase markers)
        shell: bash
        run: node scripts/projections-probe.mjs

      # Section bisect: 0xC0000409 discards buffered stdout, so a monolithic
      # run dies silently mid-file. Each top-level section runs as its own
      # step; continue-on-error lets every section report in one round.
      - name: 'Section: project-local setup'
        continue-on-error: true
        shell: bash
        run: node --test --test-name-pattern "project-local setup" test/integration/client-projections.test.mjs

      - name: 'Section: hook behavior (project scope)'
        continue-on-error: true
        shell: bash
        run: node --test --test-name-pattern "project hooks" test/integration/client-projections.test.mjs

      - name: 'Section: marketplace bundles'
        continue-on-error: true
        shell: bash
        run: node --test --test-name-pattern "marketplace" test/integration/client-projections.test.mjs

      - name: 'Section: MCP handshake'
        continue-on-error: true
        shell: bash
        run: node --test --test-name-pattern "MCP handshake" test/integration/client-projections.test.mjs

      - name: Projections suite (direct, in-process)
        shell: bash
        run: node test/integration/client-projections.test.mjs
