name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs from the Actions tab on any branch — lets the advisory native
  # jobs be exercised without opening a PR.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Audit (fails only on advisories outside the documented allowlist)
        run: npm run audit:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --maxWorkers=2

      # In-band on purpose: inside a jest-worker child on Windows this suite
      # dies with a silent native crash; in the main jest process a real crash
      # surfaces as this step's own exit code. The ladder isolates which layer
      # dies when the step fails with no output (observed on windows-latest):
      # each rung proves the previous layer alive.
      - name: Client projections suite (in-band)
        shell: bash
        run: |
          set -e
          node --version
          node --experimental-vm-modules node_modules/jest/bin/jest.js --version
          # Slash-free ignore pattern on purpose: Git Bash (MSYS) silently
          # rewrites a leading-/ argument into a Windows path.
          echo "rung3: listTests"
          node --experimental-vm-modules node_modules/jest/bin/jest.js --testPathIgnorePatterns=node_modules --runInBand --runTestsByPath test/integration/client-projections.test.ts --listTests
          echo "rung4: full run"
          node --experimental-vm-modules node_modules/jest/bin/jest.js --testPathIgnorePatterns=node_modules --runInBand --runTestsByPath test/integration/client-projections.test.ts

      - name: Verify dist structure
        run: |
          test -f dist/mcp/index.js
          test -f dist/index.js
          echo "✓ dist/ structure OK"

      - name: Verify bin is executable
        run: |
          set -o pipefail
          chmod +x dist/mcp/index.js
          test -x dist/mcp/index.js
          node dist/mcp/index.js --help | grep -q 'repovine'
          echo "✓ bin entry OK"

      # Pack, install into a clean repo, and drive the MCP over stdio — the path
      # `npx -y repovine@<version>` takes. Catches runtime imports that resolve in the
      # engine checkout only because devDependencies are installed there.
      - name: Smoke test packed install
        run: node scripts/smoke-pack-install.mjs

      # The plugin repo (legann/repovine-client-plugins) is rendered from engine SSoT.
      # Render it to a temp root and validate the projection: manifests, MCP pins, hook layout.
      - name: Verify client plugin projection
        run: |
          node scripts/render-client-plugins.mjs --out "$RUNNER_TEMP/client-plugins" --allow-unpublished
          node scripts/validate-client-plugins.mjs --out "$RUNNER_TEMP/client-plugins"
          echo "✓ client plugin projection OK"

  # Native core jobs (docs/platform-support.md): required merge gates since the
  # 2026-07-22 green run (flipped from advisory once the native
  # suites went green). Add both names to branch protection.
  core-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-windows
            os: windows-latest
          - name: core-macos-arm
            os: macos-15
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --maxWorkers=2

      # In-band on purpose: inside a jest-worker child on Windows this suite
      # dies with a silent native crash; in the main jest process a real crash
      # surfaces as this step's own exit code. The ladder isolates which layer
      # dies when the step fails with no output (observed on windows-latest):
      # each rung proves the previous layer alive.
      - name: Client projections suite (in-band)
        shell: bash
        run: |
          set -e
          node --version
          node --experimental-vm-modules node_modules/jest/bin/jest.js --version
          # Slash-free ignore pattern on purpose: Git Bash (MSYS) silently
          # rewrites a leading-/ argument into a Windows path.
          echo "rung3: listTests"
          node --experimental-vm-modules node_modules/jest/bin/jest.js --testPathIgnorePatterns=node_modules --runInBand --runTestsByPath test/integration/client-projections.test.ts --listTests
          echo "rung4: full run"
          node --experimental-vm-modules node_modules/jest/bin/jest.js --testPathIgnorePatterns=node_modules --runInBand --runTestsByPath test/integration/client-projections.test.ts

      - name: Smoke test packed install
        run: node scripts/smoke-pack-install.mjs

  harness-linux:
    name: harness-linux (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install engine dependencies
        run: npm ci

      - name: Build engine
        run: npm run build

      - name: Install demo dependencies
        run: npm ci
        working-directory: examples/agent-harness-demo

      - name: Demo tests
        run: npm test
        working-directory: examples/agent-harness-demo
