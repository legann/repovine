apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-worker
spec:
  serviceName: demo-worker
  replicas: 1
  selector:
    matchLabels:
      app: demo-worker
  template:
    metadata:
      labels:
        app: demo-worker
    spec:
      containers:
        - name: worker
          image: demo/worker:local
